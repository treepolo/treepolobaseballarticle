<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg"><title>陳冠榮問題與特徵推導心智圖 v4</title><desc>由左側觀察到的問題與特徵（A、C、D、E、F）出發，箭頭指向推導出的內容（G 至 K）。B 已併入 A。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="150" y1="96" x2="240" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="150" y1="178" x2="240" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="150" y1="96" x2="240" y2="228" class="arr" marker-end="url(#arrow)"/>
